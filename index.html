<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Locket Gold</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="page">
    <section class="profile-card">
      <div class="avatar-ring">
        <img
          src="[https://github.com/](https://github.com/)nghuuduong6666.png"
          alt="Locket Gold"
          class="avatar"
        />
      </div>

      <h1 class="title">Locket Gold</h1>

      <div class="stack">
        <div class="item-box">
          <div class="item-left">
            <span class="icon-badge module-icon" aria-hidden="true">M</span>
            <span class="item-label">Module</span>
          </div>
          <button
            type="button"
            class="action-btn"
            id="copy-module-btn"
            data-url="https://raw.githubusercontent.com/vuong2023/shad/main/modules/Locket_ohb.sgmodule"
          >
            Sao chép
          </button>
        </div>

        <div class="item-box">
          <div class="item-left">
            <span class="icon-badge dns-icon" aria-hidden="true">DNS</span>
            <span class="item-label">Dns</span>
          </div>
          <a
            href="https://apple.nextdns.io/?profile=a2dd89"
            target="_blank"
            rel="noopener noreferrer"
            class="action-btn"
          >
            Cài vào máy
          </a>
        </div>
      </div>

      <p id="toast" class="toast" aria-live="polite"></p>

      <footer class="footer">
        © <span id="year"></span> • Hosted on GitHub Pages
      </footer>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
